<svg width="720" viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>One memory access is two lookups: translate, then fetch</title>
  <desc>The CPU emits a virtual address. The TLB translates it: a hit returns the physical frame in about a cycle; a miss walks the multi-level page table in RAM, then caches the result. Only then is the data fetched from that physical address.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .st { fill:none; stroke:#2A3A4A; stroke-width:1.3; }
    .stthin { fill:none; stroke:#5A6B7D; stroke-width:1; }
    .good { fill:none; stroke:#2F7D5B; stroke-width:1.7; }
    .bad  { fill:none; stroke:#B4741A; stroke-width:1.7; }
    .fcpu{fill:#E1EEF4;} .ftlb{fill:#E7ECF2;} .fwalk{fill:#F7E7CE;} .fmem{fill:#DFF0E7;} .fcard{fill:#FFFFFF;}
    .txt{fill:#1C2B3A;} .soft{fill:#5A6B7D;} .tcpu{fill:#2E6E8E;} .tgood{fill:#2F7D5B;} .tbad{fill:#B4741A;}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;}
    .serif{font-family:Georgia,"Times New Roman",serif; font-style:italic;}
  </style>
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2F7D5B"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#B4741A"/></marker>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2A3A4A"/></marker>
  </defs>

  <rect x="1" y="1" width="718" height="298" rx="8" fill="#F8FAFC" stroke="#DDE4EC"/>
  <text x="360" y="28" text-anchor="middle" class="serif soft" font-size="11">every access to a virtual address takes two steps: translate it, then fetch the data</text>

  <!-- CPU -->
  <rect x="24" y="120" width="120" height="56" rx="6" class="fcpu"/><rect x="24" y="120" width="120" height="56" class="st"/>
  <text x="84" y="144" text-anchor="middle" class="mono tcpu" font-size="11" font-weight="700">CPU</text>
  <text x="84" y="161" text-anchor="middle" class="mono soft" font-size="9">wants addr V</text>

  <!-- arrow to TLB -->
  <path d="M144,148 L184,148" class="st" marker-end="url(#ad)"/>

  <!-- TLB -->
  <rect x="186" y="116" width="150" height="64" rx="6" class="ftlb"/><rect x="186" y="116" width="150" height="64" class="st"/>
  <text x="261" y="140" text-anchor="middle" class="mono txt" font-size="11" font-weight="700">TLB</text>
  <text x="261" y="156" text-anchor="middle" class="soft" font-size="8.5">is V's page cached?</text>
  <text x="261" y="169" text-anchor="middle" class="soft" font-size="8">tiny, on the chip</text>

  <!-- HIT path (green, straight to physical) -->
  <path d="M336,134 L520,134" class="good" marker-end="url(#ag)"/>
  <text x="428" y="126" text-anchor="middle" class="tgood mono" font-size="9.5" font-weight="700">HIT: frame, about 1 cycle</text>

  <!-- physical address / fetch -->
  <rect x="522" y="112" width="172" height="60" rx="6" class="fmem"/><rect x="522" y="112" width="172" height="60" class="st"/>
  <text x="608" y="136" text-anchor="middle" class="mono tgood" font-size="10.5" font-weight="700">physical addr</text>
  <text x="608" y="153" text-anchor="middle" class="soft" font-size="8.5">then FETCH the data</text>
  <text x="608" y="165" text-anchor="middle" class="soft" font-size="8">(the second lookup)</text>

  <!-- MISS path (amber, down to walk) -->
  <path d="M261,180 L261,214" class="bad" marker-end="url(#ab)"/>
  <text x="270" y="200" class="tbad mono" font-size="9.5" font-weight="700">MISS</text>

  <!-- page table walk -->
  <rect x="150" y="216" width="230" height="54" rx="6" class="fwalk"/><rect x="150" y="216" width="230" height="54" class="st"/>
  <text x="265" y="239" text-anchor="middle" class="mono tbad" font-size="10.5" font-weight="700">walk the page table</text>
  <text x="265" y="255" text-anchor="middle" class="soft" font-size="8.5">the ledger in RAM, several reads, slow</text>

  <!-- walk -> physical (found) -->
  <path d="M380,238 L500,238 L500,174" class="good" marker-end="url(#ag)"/>
  <text x="452" y="231" text-anchor="middle" class="tgood mono" font-size="8.5">found frame</text>

  <!-- walk -> cache back into TLB (dashed amber) -->
  <path d="M186,224 L120,224 L120,148 L184,148" class="stthin" stroke-dasharray="4 3"/>
  <text x="112" y="190" text-anchor="middle" class="tbad mono" font-size="8" transform="rotate(-90 112,190)">cache it for next time</text>
</svg>
