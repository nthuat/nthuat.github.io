<svg width="680" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>FlashAttention: online softmax per K-block iteration</title>
  <desc>Four-step online softmax loop: score, new max, rescale, accumulate — with feedback arrow showing state carries over across K-blocks.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #1a1a1a; }
      .label-sm { font-size: 11px; fill: #666; }
      .label-md { font-size: 13px; fill: #1a1a1a; }
      .label-bold { font-size: 13px; font-weight: 600; }
      .label-mono { font-size: 11px; font-family: monospace; }
      .section-tag { font-size: 10px; letter-spacing: 0.1em; fill: #999; }
    </style>
  </defs>

  <rect width="680" height="400" fill="#fafaf9"/>

  <!-- Section label -->
  <text class="section-tag" x="40" y="28">Online softmax — per K-block iteration</text>

  <!-- Loop header -->
  <rect x="32" y="38" width="612" height="36" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="338" y="60" text-anchor="middle" font-family="monospace" font-size="13px" fill="#444">for k_block in range(N // BLOCK_K):</text>

  <!-- Step 1: score -->
  <rect x="32" y="90" width="138" height="80" rx="8" fill="#eeedfe" stroke="#534AB7" stroke-width="0.5"/>
  <text class="label-bold" x="101" y="112" text-anchor="middle" fill="#3C3489">1. score</text>
  <text class="label-mono" x="101" y="132" text-anchor="middle" fill="#534AB7">S = Q·Kᵀ / √d</text>
  <text class="label-sm" x="101" y="152" text-anchor="middle">[BLOCK_Q, BLOCK_K]</text>

  <line x1="170" y1="130" x2="190" y2="130" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Step 2: new max -->
  <rect x="190" y="90" width="148" height="80" rx="8" fill="#faeeda" stroke="#854F0B" stroke-width="0.5"/>
  <text class="label-bold" x="264" y="112" text-anchor="middle" fill="#633806">2. new max</text>
  <text class="label-mono" x="264" y="132" text-anchor="middle" fill="#854F0B">m_new =</text>
  <text class="label-mono" x="264" y="150" text-anchor="middle" fill="#854F0B">max(m, max(S))</text>

  <line x1="338" y1="130" x2="358" y2="130" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Step 3: rescale -->
  <rect x="358" y="90" width="148" height="80" rx="8" fill="#e1f5ee" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="label-bold" x="432" y="108" text-anchor="middle" fill="#085041">3. rescale</text>
  <text class="label-mono" x="432" y="128" text-anchor="middle" fill="#0F6E56">α = exp(m − m_new)</text>
  <text class="label-mono" x="432" y="146" text-anchor="middle" fill="#0F6E56">P = exp(S − m_new)</text>
  <text class="label-sm" x="432" y="162" text-anchor="middle" fill="#0F6E56">re-weight prev. output</text>

  <line x1="506" y1="130" x2="526" y2="130" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Step 4: accumulate -->
  <rect x="526" y="90" width="122" height="80" rx="8" fill="#faece7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="label-bold" x="587" y="108" text-anchor="middle" fill="#712B13">4. accumulate</text>
  <text class="label-mono" x="587" y="128" text-anchor="middle" fill="#993C1D">l = α·l + sum(P)</text>
  <text class="label-mono" x="587" y="146" text-anchor="middle" fill="#993C1D">O = α·O + P·V</text>
  <text class="label-sm" x="587" y="164" text-anchor="middle" fill="#993C1D">update m = m_new</text>

  <!-- Feedback arrow -->
  <path d="M 587 170 Q 587 218 432 226 Q 264 234 101 226 Q 68 218 68 170" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="label-sm" x="338" y="248" text-anchor="middle">next K-block — m, l, O carry over</text>

  <!-- Finalize -->
  <rect x="200" y="264" width="280" height="48" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text class="label-bold" x="340" y="284" text-anchor="middle" fill="#444">finalize</text>
  <text x="340" y="302" text-anchor="middle" font-family="monospace" font-size="12px" fill="#555">O = O / l    ← correct softmax</text>

  <line x1="340" y1="252" x2="340" y2="262" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Why it works -->
  <rect x="32" y="326" width="612" height="52" rx="8" fill="#e1f5ee" stroke="#1D9E75" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text class="label-md" x="338" y="346" text-anchor="middle" fill="#085041">α rescales previous output when a larger max is found — identical to full softmax</text>
  <text class="label-sm" x="338" y="366" text-anchor="middle" fill="#0F6E56">without ever storing the N×N score matrix. HBM traffic: O(N²) → O(N).</text>
</svg>
