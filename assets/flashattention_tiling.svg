<svg width="680" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>FlashAttention: tiling memory layout (A10G)</title>
  <desc>Shows how Q/K/V tiles move from HBM into SRAM on A10G, with output written back once.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #1a1a1a; }
      .label-sm { font-size: 11px; fill: #666; }
      .label-md { font-size: 13px; fill: #1a1a1a; }
      .label-bold { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .label-mono { font-size: 12px; font-family: monospace; fill: #444; }
      .section-tag { font-size: 10px; letter-spacing: 0.1em; fill: #999; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="680" height="480" fill="#fafaf9"/>

  <!-- Section label -->
  <text class="section-tag" x="40" y="30">Memory layout - A10G</text>

  <!-- HBM container -->
  <rect x="32" y="44" width="248" height="310" rx="10" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text class="label-bold" x="156" y="68" text-anchor="middle">HBM</text>
  <text class="label-sm" x="156" y="84" text-anchor="middle">GPU main memory · 600 GB/s peak</text>

  <!-- Q matrix -->
  <rect x="52" y="100" width="88" height="236" rx="6" fill="#eeedfe" stroke="#534AB7" stroke-width="0.5"/>
  <text class="label-bold" x="96" y="172" text-anchor="middle" fill="#3C3489">Q</text>
  <text class="label-mono" x="96" y="190" text-anchor="middle" fill="#534AB7">[N, d]</text>
  <rect x="52" y="100" width="88" height="56" rx="4" fill="none" stroke="#7F77DD" stroke-width="2" stroke-dasharray="4 2"/>
  <text class="label-sm" x="96" y="132" text-anchor="middle" fill="#534AB7">BLOCK_Q</text>

  <!-- K matrix -->
  <rect x="156" y="100" width="52" height="236" rx="6" fill="#e1f5ee" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="label-bold" x="182" y="210" text-anchor="middle" fill="#085041">K</text>
  <text class="label-mono" x="182" y="226" text-anchor="middle" fill="#0F6E56">[N, d]</text>
  <rect x="156" y="100" width="52" height="44" rx="4" fill="none" stroke="#1D9E75" stroke-width="2" stroke-dasharray="4 2"/>
  <text class="label-sm" x="182" y="126" text-anchor="middle" fill="#0F6E56">BK</text>

  <!-- V matrix -->
  <rect x="220" y="100" width="48" height="236" rx="6" fill="#faece7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="label-bold" x="244" y="210" text-anchor="middle" fill="#712B13">V</text>
  <text class="label-mono" x="244" y="226" text-anchor="middle" fill="#993C1D">[N, d]</text>
  <rect x="220" y="100" width="48" height="44" rx="4" fill="none" stroke="#D85A30" stroke-width="2" stroke-dasharray="4 2"/>
  <text class="label-sm" x="244" y="126" text-anchor="middle" fill="#993C1D">BK</text>

  <!-- Arrows HBM → SRAM -->
  <path d="M 100 128 Q 340 86 418 126" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 182 122 Q 340 72 448 126" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 244 122 Q 340 60 478 126" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="label-sm" x="310" y="70" text-anchor="middle">read once per block</text>

  <!-- SRAM container -->
  <rect x="400" y="44" width="244" height="310" rx="10" fill="#faeeda" stroke="#854F0B" stroke-width="0.5"/>
  <text class="label-bold" x="522" y="68" text-anchor="middle" fill="#633806">SRAM</text>
  <text class="label-sm" x="522" y="84" text-anchor="middle" fill="#854F0B">on-chip · ~96 KB (A10G)</text>

  <!-- q_tile -->
  <rect x="416" y="100" width="100" height="56" rx="6" fill="#eeedfe" stroke="#534AB7" stroke-width="0.5"/>
  <text class="label-bold" x="466" y="124" text-anchor="middle" fill="#3C3489">q_tile</text>
  <text class="label-mono" x="466" y="142" text-anchor="middle" fill="#534AB7">[64, 64]</text>

  <!-- k_tile -->
  <rect x="416" y="168" width="100" height="52" rx="6" fill="#e1f5ee" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="label-bold" x="466" y="190" text-anchor="middle" fill="#085041">k_tile</text>
  <text class="label-mono" x="466" y="206" text-anchor="middle" fill="#0F6E56">[64, 64]</text>

  <!-- v_tile -->
  <rect x="416" y="232" width="100" height="52" rx="6" fill="#faece7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="label-bold" x="466" y="254" text-anchor="middle" fill="#712B13">v_tile</text>
  <text class="label-mono" x="466" y="270" text-anchor="middle" fill="#993C1D">[64, 64]</text>

  <!-- compute box -->
  <rect x="528" y="168" width="104" height="116" rx="6" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text class="label-bold" x="580" y="192" text-anchor="middle" fill="#444">compute</text>
  <text class="label-mono" x="580" y="210" text-anchor="middle">S = q·kᵀ</text>
  <text class="label-mono" x="580" y="228" text-anchor="middle">softmax</text>
  <text class="label-mono" x="580" y="246" text-anchor="middle">O += p·v</text>
  <text class="label-sm" x="580" y="264" text-anchor="middle">(SRAM only)</text>

  <!-- arrows inside SRAM -->
  <line x1="516" y1="196" x2="526" y2="208" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="516" y1="242" x2="526" y2="242" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="516" y1="270" x2="526" y2="262" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Write O back to HBM -->
  <path d="M 580 286 Q 580 326 400 334 Q 280 340 270 354" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text class="label-sm" x="430" y="322" text-anchor="middle">write O once</text>

  <!-- O output box -->
  <rect x="52" y="348" width="228" height="44" rx="6" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text class="label-bold" x="166" y="366" text-anchor="middle">O output</text>
  <text class="label-sm" x="166" y="382" text-anchor="middle">[N, d] - written once to HBM</text>

  <!-- Callout -->
  <rect x="32" y="406" width="612" height="52" rx="8" fill="#faeeda" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text class="label-md" x="338" y="426" text-anchor="middle" fill="#633806">K and V each read once per Q-tile regardless of N. No N×N matrix in HBM.</text>
  <text class="label-sm" x="338" y="446" text-anchor="middle" fill="#854F0B">A10G: SRAM fits BLOCK_Q=128 - but register pressure makes BLOCK_Q=64 faster.</text>
</svg>
